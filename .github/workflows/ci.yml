name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - run: npm run test -w packages/ptyd
      - run: npm run test -w packages/relay
      - run: npm run test -w packages/runner
      # terminal.test.ts passes, then node-pty's native teardown aborts the
      # whole run (Napi::Error, exit 134) on GitHub's macOS runners — 4/4
      # crashes right after this file across runs. CI skips it; it runs in
      # every local suite, and packages/ptyd's own tests cover the pty core
      # here. Tracked in the node-pty teardown issue.
      - run: npm run test -w packages/server -- --fileParallelism=false --exclude "**/terminal.test.ts"
      # Forks pool = a fresh process per test file. The web suite wedges when
      # a worker is reused across files (state accumulates — the stall point
      # moves with the pooling mode), so isolation is the fix, not ordering.
      # Direct vitest because npm's -- passthrough is dropped by the
      # package's version-gated (if/fi) test script.
      - run: npx vitest run --pool=forks
        working-directory: packages/web

  package-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node scripts/package-mac.mjs
      - uses: actions/upload-artifact@v4
        with: { name: dmg-unsigned, path: release/*.dmg }

  package-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node scripts/package-linux.mjs
      - uses: actions/upload-artifact@v4
        with: { name: linux-unsigned, path: "release/*.AppImage" }
